name: Precompilar aiograpi y dependencias ARM

on:
  schedule:
    # Corre todos los domingos a la medianoche (UTC)
    - cron: '0 0 * * 0'
  workflow_dispatch: # Permite ejecucion manual

permissions:
  contents: write

jobs:
  build_wheels:
    name: Compilar wheels para ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: armv7l
            qemu_arch: arm
            docker_image: quay.io/pypa/manylinux2014_armv7l
          - arch: aarch64
            qemu_arch: aarch64
            docker_image: quay.io/pypa/manylinux2014_aarch64

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Configurar QEMU para emulacion ARM
        uses: docker/setup-qemu-action@v3
        with:
          platforms: ${{ matrix.qemu_arch }}

      - name: Compilar Wheels C/Rust en contenedor ARM nativo
        run: |
          mkdir -p wheelhouse
          docker run --rm --platform linux/${{ matrix.qemu_arch }} \
            -v ${{ github.workspace }}:/ws \
            ${{ matrix.docker_image }} \
            bash -c "
              cd /ws
              /opt/python/cp310-cp310/bin/pip install --upgrade pip setuptools wheel
              /opt/python/cp310-cp310/bin/pip wheel aiograpi -w /ws/wheelhouse/
            "

      - name: Subir Wheels como Artefactos Temporales
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.arch }}
          path: wheelhouse/*.whl

  publish_release:
    name: Crear Release Beta/Test
    needs: build_wheels
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Generar Tag con Fecha y Hora
        id: tag_gen
        run: |
          TAG_NAME="build-$(date +'%Y.%m.%d-%H%M%S')"
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Descargar todos los artefactos compilados
        uses: actions/download-artifact@v4
        with:
          path: all_wheels

      - name: Organizar Wheels en una sola carpeta
        run: |
          mkdir -p release_assets
          find all_wheels/ -type f -name "*.whl" -exec cp {} release_assets/ \;

      - name: Crear GitHub Release (Beta / Pre-release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_gen.outputs.tag }}
          name: "Build Beta ARM (${{ steps.tag_gen.outputs.tag }})"
          body: |
            Compilacion semanal automatica de `aiograpi` y dependencias para arquitecturas ARM (`armv7l`, `aarch64`).
            * **Nota:** Esta es una compilacion de prueba/beta (Pre-release).
          prerelease: true
          make_latest: false
          files: release_assets/*.whl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
