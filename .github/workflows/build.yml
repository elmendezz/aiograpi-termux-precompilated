
name: Precompilar aiograpi y dependencias ARM

on:
  schedule:
    # Corre todos los domingos a la medianoche (UTC)
    - cron: '0 0 * * 0'
  workflow_dispatch: # Permite ejecucion manual

permissions:
  contents: write

jobs:
  build_wheels:
    name: Compilar wheels para ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: armv7
            system_arch: armv7
          - arch: aarch64
            system_arch: aarch64

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Compilar Wheels ARM en entorno embebido
        uses: uraimo/run-on-arch-action@v2
        with:
          arch: ${{ matrix.system_arch }}
          distro: ubuntu22.04
          githubToken: ${{ github.token }}
          setup: |
            mkdir -p "${PWD}/wheelhouse"
          run: |
            apt-get update && apt-get install -y \
              python3 python3-pip python3-dev build-essential \
              libffi-dev libssl-dev rustc cargo \
              libjpeg-dev zlib1g-dev libfreetype6-dev liblcms2-dev libwebp-dev tcl8.6-dev tk8.6-dev python3-tk libharfbuzz-dev libfribidi-dev libxcb1-dev
            python3 -m pip install --upgrade pip setuptools wheel
            python3 -m pip wheel aiograpi -w ./wheelhouse/

      - name: Subir Wheels como Artefactos Temporales
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.arch }}
          path: wheelhouse/*.whl

  publish_release:
    name: Crear Release Beta/Test
    needs: build_wheels
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Generar Tag con Fecha y Hora
        id: tag_gen
        run: |
          TAG_NAME="build-$(date +'%Y.%m.%d-%H%M%S')"
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Descargar todos los artefactos compilados
        uses: actions/download-artifact@v4
        with:
          path: all_wheels

      - name: Organizar Wheels en una sola carpeta
        run: |
          mkdir -p release_assets
          find all_wheels/ -type f -name "*.whl" -exec cp {} release_assets/ \;

      - name: Crear GitHub Release (Beta / Pre-release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_gen.outputs.tag }}
          name: "Build Beta ARM (${{ steps.tag_gen.outputs.tag }})"
          body: |
            Compilacion semanal automatica de `aiograpi` y dependencias para arquitecturas ARM (`armv7`, `aarch64`).
            * **Nota:** Esta es una compilacion de prueba/beta (Pre-release).
          prerelease: true
          make_latest: false
          files: release_assets/*.whl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
